<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ほうじ茶輸出ターゲットリスト - ダウンロード</title>
<style>
  body { font-family: 'Arial', sans-serif; background: #f5f5f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
  .card { background: white; border-radius: 12px; padding: 48px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); text-align: center; max-width: 480px; width: 90%; }
  .icon { font-size: 64px; margin-bottom: 16px; }
  h1 { color: #2D5016; font-size: 22px; margin-bottom: 8px; }
  p { color: #666; font-size: 14px; margin-bottom: 32px; line-height: 1.6; }
  .stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 32px; }
  .stat { background: #f0f5ea; border-radius: 8px; padding: 12px 20px; }
  .stat-num { font-size: 24px; font-weight: bold; color: #2D5016; }
  .stat-label { font-size: 12px; color: #666; }
  a.btn { display: inline-block; background: #2D5016; color: white; text-decoration: none; padding: 14px 40px; border-radius: 8px; font-size: 16px; font-weight: bold; transition: background 0.2s; }
  a.btn:hover { background: #3d6b1e; }
  .cities { font-size: 12px; color: #999; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🍵</div>
  <h1>ほうじ茶輸出ターゲットリスト</h1>
  <p>日本の小規模茶園のほうじ茶を海外に輸出するための<br>ターゲット店舗リスト（実在する店舗のみ）</p>
  <div class="stats">
    <div class="stat">
      <div class="stat-num">120</div>
      <div class="stat-label">店舗数</div>
    </div>
    <div class="stat">
      <div class="stat-num">4</div>
      <div class="stat-label">都市</div>
    </div>
    <div class="stat">
      <div class="stat-num">8</div>
      <div class="stat-label">情報項目</div>
    </div>
  </div>
  <a class="btn" href="/hojicha_export_targets.xlsx" download>📥 Excelファイルをダウンロード</a>
  <div class="cities">Singapore · Hong Kong · Bangkok · Dubai</div>
</div>
</body>
</html>
